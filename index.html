    // --- SES FONKS02YONLARI ---
    function initializeSounds() { 
        if (typeof Tone === 'undefined') { 
            console.error("Tone.js k¨¹t¨¹phanesi y¨¹klenemedi."); 
            return; 
        } 
        sounds = { 
            synth: new Tone.Synth({
                oscillator: { type: 'sine' },
                envelope: { attack: 0.1, decay: 0.2, sustain: 0.3, release: 0.5 }
            }).toDestination(),
            collect: new Tone.Synth({ 
                oscillator: { type: 'triangle' }, 
                envelope: { attack: 0.01, decay: 0.1, sustain: 0.2, release: 0.1 } 
            }).toDestination(), 
            sale: new Tone.Synth({

            background: new Tone.MembraneSynth().toDestination()

    function playSound(type, note, duration = '8n') { 
        if (!audioStarted || !sounds[type]) return; 
        try { 
            sounds[type].triggerAttackRelease(note, duration); 
        } catch (e) { 
            console.error("Ses 0Š4al03namad03:", e); 
        } 
    }

    function drawWithShadow(drawFunc, shadowColor = 'rgba(0, 0, 0, 0.3)', blur = 8, offsetX = 4, offsetY = 4) { 
        ctx.shadowColor = shadowColor; 
        ctx.shadowBlur = blur; 
        ctx.shadowOffsetX = offsetX; 
        ctx.shadowOffsetY = offsetY; 
        drawFunc(); 
        ctx.shadowColor = 'transparent'; 
        ctx.shadowBlur = 0; 
        ctx.shadowOffsetX = 0; 
        ctx.shadowOffsetY = 0; 
    }
    
    function drawPlayer(ctx, pos) { 
        drawWithShadow(() => { 
            // Kafa
            ctx.fillStyle = '#ffc0cb'; 
            ctx.beginPath(); 
            ctx.arc(pos.x, pos.y - 15, 15, 0, Math.PI * 2); 
            ctx.fill(); 
            
            // Sa0Š4
            ctx.fillStyle = '#654321';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y - 20, 18, Math.PI, 2 * Math.PI);
            ctx.fill();
            
            // V¨¹cut
            ctx.fillStyle = '#800080'; 
            ctx.fillRect(pos.x - 12, pos.y, 24, 30);
            
            // Kollar
            ctx.fillStyle = '#e0ac69';
            ctx.fillRect(pos.x - 18, pos.y + 5, 8, 20);
            ctx.fillRect(pos.x + 10, pos.y + 5, 8, 20);
            
            // Ayaklar

            ctx.fillRect(pos.x - 10, pos.y + 28, 8, 12);
            ctx.fillRect(pos.x + 2, pos.y + 28, 8, 12);
        }); 
    }

            // Robot v¨¹cut
            ctx.fillStyle = '#C0C0C0'; 
            ctx.fillRect(pos.x - 10, pos.y - 5, 20, 25);
            
            // Robot kafa
            ctx.fillStyle = colors[type] || '#A9A9A9';
            ctx.beginPath(); 
            ctx.arc(pos.x, pos.y - 15, 12, 0, Math.PI * 2); 
            ctx.fill(); 
            
            // G0‹2z
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y - 15, 4, 0, Math.PI * 2);

                }[type] || '7Ä2'; 
                ctx.fillText(itemEmoji, pos.x + 18, pos.y - 5); 
            } 
        }); 
    }

        ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';

    function drawOrderBubble(ctx, pos, emoji) { 
        const bubbleX = pos.x; 
        const bubbleY = pos.y - 60; 
        
        // Konu0”6ma balonu
        ctx.fillStyle = 'white';

        // Emoji

        ctx.textBaseline = 'middle'; 
        ctx.fillStyle = 'black'; 
        ctx.fillText(emoji, bubbleX, bubbleY); 
    }PI * 2); 
            ctx.fill(); 
            
            // 0”5apka
            ctx.fillStyle = '#8B4513'; 
            ctx.fillRect(pos.x - 18, pos.y - 25, 36, 10);

            // V¨¹cut
            ctx.fillStyle = '#4682B4'; 
            ctx.beginPath();

            // V¨¹cut
            ctx.fillStyle = 'white';

            ctx.fillStyle = '#8B4513';

    // --- YARDIMCI HAREKET S02STEM02 (YEN02DEN YAZILDI) ---
    function distance(pos1, pos2) {
        return Math.hypot(pos1.x - pos2.x, pos1.y - pos2.y);
    }
    
    function moveTowards(entity, targetPos, speed = 2) {
        const dist = distance(entity.pos, targetPos);
        if (dist < speed) {
            entity.pos.x = targetPos.x;
            entity.pos.y = targetPos.y;
            return true; // Hedefe ula0”6t03
        }
        
        const angle = Math.atan2(targetPos.y - entity.pos.y, targetPos.x - entity.pos.x);
        entity.pos.x += Math.cos(angle) * speed;
        entity.pos.y += Math.sin(angle) * speed;
        return false;
    }

    function findNearestAvailableSource(helper, sourceType) {
        const sources = Object.values(gameState.locations).filter(loc => 
            loc.type === sourceType && 
            loc.owned && 
            loc.ready && 
            !loc.claimedBy
        );
        
        if (sources.length === 0) return null;
        
        return sources.reduce((nearest, current) => {
            const nearestDist = distance(helper.pos, nearest.pos);
            const currentDist = distance(helper.pos, current.pos);
            return currentDist < nearestDist ? current : nearest;
        });
    }

    function updateHelper(helper) {
        if (!helper.task) {
            assignTask(helper);
        }
        
        if (helper.task && helper.targetPos) {
            if (moveTowards(helper, helper.targetPos, 2.5)) {
                executeHelperTask(helper);
            }
        }
    }

    function assignTask(helper) {
        const storagePos = gameState.locations.storageBox.pos;
        
        // Temel kaynak toplama i0”60Š4ileri
        if (['milk', 'egg', 'wood', 'wheat'].includes(helper.type)) {
            const sourceTypeMap = { milk: 'cow', egg: 'chicken', wood: 'tree', wheat: 'wheat' };
            const source = findNearestAvailableSource(helper, sourceTypeMap[helper.type]);
            
            if (source) {
                helper.task = 'collect';
                helper.targetPos = source.pos;
                helper.targetSource = source;
                source.claimedBy = helper.id;
                return;
            }
        }
        
        // De0Ž6irmenci
        if (helper.type === 'miller') {
            const mill = gameState.locations.mill;
            if (mill.owned && !mill.processing && !mill.hasProduct && gameState.storage.wheat >= mill.level) {
                helper.task = 'process_mill';
                helper.targetPos = storagePos;
                helper.targetMachine = mill;
                return;
            }
        }
        
        // F03r03nc03
        if (helper.type === 'baker') {
            const oven = gameState.locations.oven;
            if (oven.owned && !oven.processing && !oven.hasProduct && gameState.storage.flour >= oven.level) {
                helper.task = 'process_oven';
                helper.targetPos = storagePos;
                helper.targetMachine = oven;
                return;
            }
        }
        
        // Toplay03c03
        if (helper.type === 'collector') {
            const readyMachines = Object.values(gameState.locations).filter(loc => 
                (loc.type === 'mill' || loc.type === 'oven') && 
                loc.owned && 
                loc.hasProduct && 
                !loc.claimedBy
            );
            
            if (readyMachines.length > 0) {
                const machine = readyMachines[0];
                helper.task = 'collect_product';
                helper.targetPos = machine.pos;
                helper.targetMachine = machine;
                machine.claimedBy = helper.id;
                return;
            }
        }
        
        // Sat03c03
        if (helper.type === 'seller') {
            const customers = [gameState.customer1, gameState.customer2].filter(c => 
                c && gameState.storage[c.wants] > 0
            );
            
            if (customers.length > 0) {
                const customer = customers[0];
                helper.task = 'sell';
                helper.targetPos = storagePos;
                helper.targetCustomer = customer;
                helper.itemToSell = customer.wants;
                return;
            }
        }
    }

    function executeHelperTask(helper) {
        const storagePos = gameState.locations.storageBox.pos;
        
        switch (helper.task) {
            case 'collect':
                if (helper.targetSource && !helper.hasItem) {
                    // Kaynaktan topla
                    helper.targetSource.ready = false;
                    helper.targetSource.cooldown = COOLDOWNS[helper.type];
                    helper.targetSource.claimedBy = null;
                    helper.hasItem = true;
                    helper.targetPos = storagePos;
                    helper.task = 'deliver';
                }
                break;
                
            case 'deliver':
                if (helper.hasItem) {
                    // Depoya teslim et
                    gameState.storage[helper.type] += helper.targetSource.level;
                    helper.hasItem = false;
                    helper.task = null;
                    helper.targetPos = null;
                    helper.targetSource = null;
                    showMessage(`${helper.type} topland03!`, 'success');
                    playSound('collect', 'E5');
                }
                break;
                
            case 'process_mill':
                if (!helper.hasItem) {
                    // Bu0Ž6day al
                    gameState.storage.wheat -= helper.targetMachine.level;
                    helper.hasItem = true;
                    helper.targetPos = helper.targetMachine.pos;
                    helper.task = 'deliver_to_mill';
                }
                break;
                
            case 'deliver_to_mill':
                if (helper.hasItem) {
                    // De0Ž6irmene ver
                    helper.targetMachine.processing = true;
                    helper.targetMachine.timer = PROCESS_TIMES.flour;
                    helper.hasItem = false;
                    helper.task = null;
                    helper.targetPos = null;
                    helper.targetMachine = null;
                    showMessage('Bu0Ž6day i0”6leniyor...', 'info');
                }
                break;
                
            case 'process_oven':
                if (!helper.hasItem) {
                    // Un al
                    gameState.storage.flour -= helper.targetMachine.level;
                    helper.hasItem = true;
                    helper.targetPos = helper.targetMachine.pos;
                    helper.task = 'deliver_to_oven';
                }
                break;
                
            case 'deliver_to_oven':
                if (helper.hasItem) {
                    // F03r03na ver
                    helper.targetMachine.processing = true;
                    helper.targetMachine.timer = PROCESS_TIMES.bread;
                    helper.hasItem = false;
                    helper.task = null;
                    helper.targetPos = null;
                    helper.targetMachine = null;
                    showMessage('Ekmek pi0”6iyor...', 'info');
                }
                break;
                
            case 'collect_product':
                if (!helper.hasItem) {
                    // 0‰5r¨¹n¨¹ al
                    const product = helper.targetMachine.type === 'mill' ? 'flour' : 'bread';
                    helper.targetMachine.hasProduct = false;
                    helper.targetMachine.claimedBy = null;
                    helper.hasItem = true;
                    helper.targetPos = storagePos;
                    helper.task = 'deliver_product';
                    helper.productType = product;
                }
                break;
                
            case 'deliver_product':
                if (helper.hasItem) {
                    // 0‰5r¨¹n¨¹ depoya koy
                    gameState.storage[helper.productType] += helper.targetMachine.level;
                    helper.hasItem = false;
                    helper.task = null;
                    helper.targetPos = null;
                    helper.targetMachine = null;
                    helper.productType = null;
                    showMessage(`${helper.productType} depoya kondu!`, 'success');
                    playSound('collect', 'G5');
                }
                break;
                
            case 'sell':
                if (!helper.hasItem) {
                    // 0‰5r¨¹n¨¹ al
                    gameState.storage[helper.itemToSell]--;
                    helper.hasItem = true;
                    helper.targetPos = helper.targetCustomer.pos;
                    helper.task = 'deliver_to_customer';
                }
                break;
                
            case 'deliver_to_customer':
                if (helper.hasItem) {
                    // M¨¹0”6teriye sat
                    gameState.player.money += ITEM_PRICES[helper.itemToSell];
                    helper.hasItem = false;
                    helper.task = null;
                    helper.targetPos = null;
                    
                    // M¨¹0”6teriyi kald03r
                    if (helper.targetCustomer === gameState.customer1) {
                        gameState.customer1 = null;
                    } else {
                        gameState.customer2 = null;
                    }
                    
                    helper.targetCustomer = null;
                    helper.itemToSell = null;
                    showMessage('Sat030”6 yap03ld03!', 'success');
                    playSound('sale', 'C5');
                }
                break;
        }
    }

    // --- RENDER FONKS02YONU ---
    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawBackground(ctx);
        
        // 0‡5izilecek nesneleri topla ve s03rala
        let objectsToDraw = [];
        
        // Lokasyonlar03 ekle
        Object.values(gameState.locations).forEach(loc => {
            if (loc.owned) {
                let drawFunc, indicator, angle;
                
                switch(loc.type) {
                    case 'salesCounter': drawFunc = drawSalesCounter; break;
                    case 'storageBox': drawFunc = drawStorageBox; break;
                    case 'cow': drawFunc = drawCow; indicator = '•0Ô5'; break;
                    case 'chicken': drawFunc = drawChicken; indicator = '•0Ô4'; break;
                    case 'wheat': drawFunc = drawWheatField; indicator = '”9¶0'; break;
                    case 'oven': drawFunc = drawOven; break;
                    case 'tree': drawFunc = drawTree; indicator = '•0÷1'; break;
                    case 'mill': drawFunc = drawMill; angle = gameState.millAngle; break;
                }
                
                if (drawFunc) {
                    objectsToDraw.push({
                        draw: drawFunc,
                        obj: loc,
                        indicator: indicator,
                        angle: angle,
                        y: loc.pos.y
                    });
                }
            }
        });
        
        // Yard03mc03lar03 ekle
        gameState.helpers.forEach(helper => {
            objectsToDraw.push({
                draw: drawHelper,
                obj: helper,
                y: helper.pos.y
            });
        });
        
        // Oyuncuyu ekle
        objectsToDraw.push({
            draw: drawPlayer,
            obj: gameState.player,
            y: gameState.player.pos.y
        });
        
        // M¨¹0”6terileri ekle
        if (gameState.customer1) {
            objectsToDraw.push({
                draw: drawCustomer,
                obj: gameState.customer1,
                y: gameState.customer1.pos.y
            });
        }
        if (gameState.customer2) {
            objectsToDraw.push({
                draw: drawCustomer,
                obj: gameState.customer2,
                y: gameState.customer2.pos.y
            });
        }
        
        // Y koordinat03na g0‹2re s03rala (derinlik ill¨¹zyonu)
        objectsToDraw.sort((a, b) => a.y - b.y);
        
        // 0‡5iz
        objectsToDraw.forEach(({ draw, obj, indicator, angle }) => {
            if (angle !== undefined) {
                draw(ctx, obj.pos, angle);
            } else {
                draw(ctx, obj.pos, obj.type, obj.hasItem);
            }
            
            if (indicator && obj.ready) {
                drawIndicator(ctx, obj.pos, indicator);
            }
            
            if (obj.level && obj.level > 1) {
                drawLevelIndicator(ctx, obj.pos, obj.level);
            }
        });
        
        // M¨¹0”6teri sipari0”6lerini g0‹2ster
        if (gameState.customer1) {
            drawOrderBubble(ctx, gameState.customer1.pos, ITEM_EMOJIS[gameState.customer1.wants]);
        }
        if (gameState.customer2) {
            drawOrderBubble(ctx, gameState.customer2.pos, ITEM_EMOJIS[gameState.customer2.wants]);
        }
        
        // Makine durumlar03n03 g0‹2ster
        const oven = gameState.locations.oven;
        if (oven.owned) {
            if (oven.hasProduct) {
                ctx.font = '30px sans-serif';
                ctx.fillText('”9¹2', oven.pos.x, oven.pos.y);
            } else if (oven.processing) {
                ctx.font = '30px sans-serif';
                ctx.fillText('7¬6„1‚5', oven.pos.x, oven.pos.y);
            }
        }
        
        const mill = gameState.locations.mill;
        if (mill.owned) {
            if (mill.hasProduct) {
                ctx.font = '30px sans-serif';
                ctx.fillText('•0Õ1', mill.pos.x, mill.pos.y);
            } else if (mill.processing) {
                ctx.font = '30px sans-serif';
                ctx.fillText('7±5„1‚5', mill.pos.x, mill.pos.y);
            }
        }
        
        // UI g¨¹ncelleme
        updateUI();
    }

    // --- OYUN G0‰5NCELLEMES02 ---
    function update() {
        // Oyuncu hareketi
        const speed = 4;
        if (keys.up.pressed && gameState.player.pos.y > 25) gameState.player.pos.y -= speed;
        if (keys.down.pressed && gameState.player.pos.y < canvas.height - 25) gameState.player.pos.y += speed;
        if (keys.left.pressed && gameState.player.pos.x > 25) gameState.player.pos.x -= speed;
        if (keys.right.pressed && gameState.player.pos.x < canvas.width - 25) gameState.player.pos.x += speed;
        
        // Etkile0”6im kontrol¨¹
        checkInteraction();
        
        // Cooldown g¨¹ncelleme
        Object.values(gameState.locations).forEach(loc => {
            if (loc.owned && loc.cooldown > 0) {
                loc.cooldown--;
                if (loc.cooldown <= 0) {
                    loc.ready = true;
                }
            }
        });
        
        // De0Ž6irmen animasyonu
        gameState.millAngle += 0.02;
        
        // M¨¹0”6teri spawn sistemi
        spawnCustomers();
        
        // M¨¹0”6teri sab03r sistemi
        updateCustomerPatience();
        
        // Makine i0”6leme
        updateMachineProcessing();
        
        // Yard03mc03 g¨¹ncelleme
        gameState.helpers.forEach(updateHelper);

    function updateMachineProcessing() {
        // F03r03n
        const oven = gameState.locations.oven;
        if (oven.owned && oven.processing) {

                oven.processing = false;
                oven.hasProduct = true;
                showMessage('Ekmek haz03r!', 'success');
                playSound('collect', 'G5');

        }
        
        // De0Ž6irmen
        const mill = gameState.locations.mill;
        if (mill.owned && mill.processing) {
            mill.timer--;
            if (mill.timer <= 0) {
                mill.processing = false;
                mill.hasProduct = true;
                showMessage('Un haz03r!', 'success');
                playSound('collect', 'G5');
            }
        }
    }

    function checkInteraction() {
        const now = Date.now();
        if (now - gameState.lastInteractionTime < 300) return;
        
        let interacted = false;
        
        // Kaynak toplama
        Object.values(gameState.locations).forEach(loc => {
            if (loc.owned && distance(gameState.player.pos, loc.pos) < 60) {
                if (loc.ready && ['cow', 'chicken', 'wheat', 'tree'].includes(loc.type)) {
                    const itemMap = { cow: 'milk', chicken: 'egg', wheat: 'wheat', tree: 'wood' };
                    const itemType = itemMap[loc.type];
                    
                    gameState.storage[itemType] += loc.level;
                    loc.ready = false;
                    loc.cooldown = COOLDOWNS[itemType];
                    
                    showMessage(`${loc.level} ${itemType} toplad03n!`, 'success');
                    playSound('collect', 'E5');
                    interacted = true;
                }
                
                // Makine etkile0”6imleri
                if (loc.type === 'oven' || loc.type === 'mill') {
                    if (loc.hasProduct) {
                        const product = loc.type === 'oven' ? 'bread' : 'flour';
                        gameState.storage[product] += loc.level;
                        loc.hasProduct = false;
                        showMessage(`${loc.level} ${product} depoya koydun!`, 'success');
                        playSound('collect', 'G5');
                        interacted = true;
                    } else if (!loc.processing) {
                        const input = loc.type === 'oven' ? 'flour' : 'wheat';
                        if (gameState.storage[input] >= loc.level) {
                            gameState.storage[input] -= loc.level;
                            loc.processing = true;
                            loc.timer = loc.type === 'oven' ? PROCESS_TIMES.bread : PROCESS_TIMES.flour;
                            showMessage(`${input} i0”6leniyor...`, 'info');
                            interacted = true;
                        } else {
                            showMessage(`Yeterli ${input} yok!`, 'error');
                            playSound('error', 'C3');
                            interacted = true;
                        }
                    }
                }
            }
        });
        
        // M¨¹0”6teri etkile0”6imi
        // M¨¹0”6teri etkile0”6imi
        [gameState.customer1, gameState.customer2].forEach(customer => {
            if (customer && distance(gameState.player.pos, customer.pos) < 60) {
                const wants = customer.wants;
                if (gameState.storage[wants] > 0) {
                    gameState.storage[wants]--;
                    gameState.player.money += ITEM_PRICES[wants];
                    
                    if (customer === gameState.customer1) {
                        gameState.customer1 = null;
                    } else {
                        gameState.customer2 = null;
                    }
                    
                    showMessage(`${ITEM_PRICES[wants]}”9Û0 kazand03n!`, 'success');
                    playSound('sale', 'C5');
                    interacted = true;
                } else {
                    showMessage(`${wants} yok!`, 'error');
                    playSound('error', 'C3');
                    interacted = true;
                }
            }
        });
        
        if (interacted) {
            gameState.lastInteractionTime = now;
        }
    }

    function createSuccessParticles(pos) {
        if (!gameState.particles) gameState.particles = [];
        
        for (let i = 0; i < 8; i++) {
            gameState.particles.push({
                x: pos.x,
                y: pos.y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8 - 2,
                life: 60,
                maxLife: 60,
                color: ['#FFD700', '#FFA500', '#FF6347', '#32CD32'][Math.floor(Math.random() * 4)]

    // Partik¨¹l g¨¹ncelleme
    function updateParticles() {
        if (!gameState.particles) return;
        
        gameState.particles = gameState.particles.filter(p => {
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2; // Yer 0Š4ekimi
            p.life--;
            return p.life > 0;
        });
    }

    // Partik¨¹l 0Š4izimi
    function drawParticles(ctx) {
        if (!gameState.particles) return;
        
        gameState.particles.forEach(p => {
            const alpha = p.life / p.maxLife;
            ctx.fillStyle = p.color + Math.floor(alpha * 255).toString(16).padStart(2, '0');
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    // Mesaj g0‹2sterme (geli0”6tirilmi0”6)
    let messageTimer;
    function showMessage(text, type = 'info', duration = 3000) {
        clearTimeout(messageTimer);
        
        messageBox.textContent = text;
        messageBox.className = 'h-12 bg-black/40 rounded-lg flex items-center justify-center p-3 text-center font-semibold border transition-all duration-300';
        
        if (type === 'success') {
            messageBox.classList.add('text-green-300', 'border-green-500', 'bg-green-900/30');
        } else if (type === 'error') {
            messageBox.classList.add('text-red-400', 'border-red-500', 'bg-red-900/30');
        } else {
            messageBox.classList.add('text-yellow-200', 'border-yellow-500', 'bg-yellow-900/30');
        }
        
        messageBox.classList.add('message-glow');
        
        messageTimer = setTimeout(() => {
            messageBox.textContent = '';
            messageBox.className = 'h-12 bg-black/40 rounded-lg flex items-center justify-center p-3 text-center text-yellow-200 font-semibold border border-gray-600';
            messageBox.classList.remove('message-glow');
        }, duration);
    }

    // Otomatik kaydetme sistemi
    function saveGame() {
        const saveData = {
            player: gameState.player,
            storage: gameState.storage,
            locations: gameState.locations,
            helpers: gameState.helpers.map(h => ({
                id: h.id,
                type: h.type,
                pos: h.pos
            })) // Sadece temel bilgileri kaydet
        };
        
        localStorage.setItem('farmEmpire_save', JSON.stringify(saveData));
    }

    function loadGame() {
        try {
            const saveData = localStorage.getItem('farmEmpire_save');
            if (saveData) {
                const data = JSON.parse(saveData);
                
                // Oyuncu ve depo bilgilerini y¨¹kle
                if (data.player) gameState.player = { ...gameState.player, ...data.player };
                if (data.storage) gameState.storage = { ...gameState.storage, ...data.storage };
                if (data.locations) {
                    Object.keys(data.locations).forEach(key => {
                        if (gameState.locations[key]) {
                            gameState.locations[key] = { ...gameState.locations[key], ...data.locations[key] };
                        }
                    });
                }
                
                // Robotlar03 y¨¹kle
                if (data.helpers && Array.isArray(data.helpers)) {
                    gameState.helpers = data.helpers.map(h => ({
                        ...h,
                        task: null,
                        targetPos: null,
                        hasItem: false,
                        targetSource: null,
                        targetMachine: null,
                        targetCustomer: null,
                        itemToSell: null,
                        productType: null
                    }));
                }
                
                showMessage('Oyun y¨¹klendi! ”9Ü4', 'success');
                return true;
            }
        } catch (e) {
            console.error('Oyun y¨¹klenirken hata:', e);
            showMessage('Kay03t dosyas03 bozuk! •07', 'error');
        }
        return false;
    }

    // Periyodik kaydetme
    setInterval(() => {
        if (gameState.player) {
            saveGame();
        }
    }, 30000); // Her 30 saniyede kaydet

    // Sayfa kapat03l03rken kaydet
    window.addEventListener('beforeunload', () => {
        if (gameState.player) {
            saveGame();
        }
    });
